<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Calculator Application</title>
</head>
<body>
    <div class="calc-container">
        <div class="calc-display">
            0
        </div>

        <div class="calc-buttons">
            <div class="calc-buttons-row">
                <button class="button-double operator">
                    AC
                </button>
                <button class="button-single deletion">
                    DEL
                </button>
                <button class="button-single operator">
                    &divide;
                </button>
            </div>

            <div class="calc-buttons-row">
                <button class="button-single">
                    7
                </button>
                <button class="button-single">
                    8
                </button>
                <button class="button-single">
                    9
                </button>
                <button class="button-single operator">
                    &times;
                </button>
            </div>

            <div class="calc-buttons-row">
                <button class="button-single">
                    4
                </button>
                <button class="button-single">
                    5
                </button>
                <button class="button-single">
                    6
                </button>
                <button class="button-single operator">
                    &minus;
                </button>
            </div>

            <div class="calc-buttons-row">
                <button class="button-single"> 
                    1
                </button>
                <button class="button-single">
                    2
                </button>
                <button class="button-single">
                    3
                </button>
                <button class="button-single operator">
                    &plus;
                </button>
            </div>

            <div class="calc-buttons-row">
                <button class="button-double">
                    0
                </button>
                <button class="button-single">
                    .
                </button>
                <button class="button-single operator">
                    &equals;
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
